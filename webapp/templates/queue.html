{% extends "base.html" %}

{% block title %}Queue — ClipCast Studio{% endblock %}
{% block page_title %}Posting Queue{% endblock %}

{% block topbar_actions %}
  <button class="btn-primary-cc" onclick="loadQueue()">
    <i class="bi bi-arrow-clockwise"></i> Refresh
  </button>
{% endblock %}

{% block content %}

<div class="queue-header-row">
  <span class="queue-count-label">
    <span id="queue-total">0</span> items
  </span>
  <div class="queue-filters">
    <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
    <button class="filter-btn" onclick="setFilter('pending', this)">Pending</button>
    <button class="filter-btn" onclick="setFilter('posted', this)">Posted</button>
    <button class="filter-btn" onclick="setFilter('failed', this)">Failed</button>
  </div>
</div>

<div id="queue-list">
  <div class="empty-state">
    <i class="bi bi-list-task empty-state-icon"></i>
    <span class="empty-state-title">Loading...</span>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
let allItems = [];
let activeFilter = 'all';

function setFilter(filter, btn) {
  activeFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function loadQueue() {
  fetch('/api/queue')
    .then(r => r.json())
    .then(items => {
      allItems = items;
      renderList();
    });
}

function renderList() {
  const filtered = activeFilter === 'all'
    ? allItems
    : allItems.filter(i => i.status === activeFilter);

  document.getElementById('queue-total').textContent = filtered.length;
  const list = document.getElementById('queue-list');

  if (!filtered.length) {
    list.innerHTML = `
      <div class="empty-state">
        <i class="bi bi-inbox empty-state-icon"></i>
        <span class="empty-state-title">Queue is empty</span>
        <span class="empty-state-sub">No ${activeFilter === 'all' ? '' : activeFilter + ' '}items in the queue right now</span>
      </div>`;
    return;
  }

  list.innerHTML = filtered.map(item => {
    const thumbHtml = item.thumbnail_path
      ? `<img src="/thumb/${item.id}" alt="" onerror="this.parentElement.innerHTML='<i class=\\'bi bi-play-fill\\'></i>'">`
      : '<i class="bi bi-play-fill"></i>';

    const platform = (item.platform || 'tiktok').toLowerCase().replace(/\s/g, '_');
    const platformLabel = {
      tiktok: 'TikTok',
      youtube_shorts: 'YouTube',
      youtube: 'YouTube',
      instagram_reels: 'Instagram',
      instagram: 'Instagram',
      both: 'Multi',
      all: 'All'
    }[platform] || platform.charAt(0).toUpperCase() + platform.slice(1);

    const platformBadgeClass = platform.replace('_shorts', '').replace('_reels', '');

    const creator = item.creator_name
      ? `<span class="queue-creator">· ${escHtml(item.creator_name)}</span>`
      : '';

    const dur = item.duration
      ? `<span class="queue-time">${item.duration}s</span>`
      : '';

    const cancelBtn = item.status === 'pending'
      ? `<button class="btn-cancel" onclick="cancelItem(${item.id})">Cancel</button>`
      : '';

    return `
      <div class="queue-card">
        <div class="queue-thumb">${thumbHtml}</div>
        <div class="queue-info">
          <div class="queue-title">${escHtml(item.clip_title || 'Untitled')}</div>
          <div class="queue-meta">
            <span class="platform-badge ${platformBadgeClass}">${platformLabel}</span>
            <span class="queue-time">${fmtTime(item.scheduled_for)}</span>
            ${dur}
            ${creator}
          </div>
        </div>
        <div class="queue-actions">
          <span class="status-pill ${item.status}">${capitalize(item.status)}</span>
          ${cancelBtn}
        </div>
      </div>`;
  }).join('');
}

function cancelItem(id) {
  if (!confirm('Cancel this queued post?')) return;
  fetch(`/api/queue/${id}/cancel`, { method: 'POST' })
    .then(r => r.json())
    .then(d => {
      showToast(d.ok ? 'Cancelled' : (d.error || 'Error'), d.ok ? 'success' : 'error');
      loadQueue();
    });
}

function fmtTime(str) {
  if (!str) return '—';
  const d = new Date(str.replace(' ', 'T'));
  if (isNaN(d)) return str.slice(0, 16).replace('T', ' ');
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  const timeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  return isToday ? `Today ${timeStr}` : d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + timeStr;
}

function capitalize(s) {
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

loadQueue();
setInterval(loadQueue, 15000);
</script>
{% endblock %}
